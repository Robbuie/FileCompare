# The checks that can run without a person watching a window.
#
# Windows, because that is where it runs: paths, long-path prefixes and the
# single-instance socket all behave as they will on the desk. The tests are
# platform-neutral and pass on Linux too.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Qt needs somewhere to draw even when nothing is shown. Without this the
      # model tests fail on the runner and pass everywhere else, which is the
      # least useful kind of failure.
      # pytest's verdict, and nothing after it. On this runner the suite
      # passes and the interpreter then crashes on the way out, in DLL
      # teardown -- see tools/run_tests.py, which ends the process without
      # running any. Bash rather than PowerShell, so the shell is not a
      # second thing that can decide the result.
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py
